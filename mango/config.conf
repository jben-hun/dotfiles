# More option see https://github.com/DreamMaoMao/mango/wiki/


# keyboard
xkb_rules_layout=hu

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,d,spawn,fuzzel
bind=SUPER,Return,spawn,alacritty
bind=SUPER+SHIFT,Return,spawn,pcmanfm
bind=SUPER+SHIFT,D,spawn_shell,cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# exit
bind=SUPER+SHIFT,q,killclient,

# switch window focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT+CTRL,Up,scroller_stack,up
bind=SUPER+SHIFT+CTRL,Down,scroller_stack,down
bind=SUPER+SHIFT+CTRL,Left,scroller_stack,left
bind=SUPER+SHIFT+CTRL,Right,scroller_stack,right

# switch window status
# bind=SUPER,Tab,togglejump,
bind=SUPER,q,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad
jump_labels=''

#dwindle layout(manual split mode)
# bindc=SUPER,e,dwindle_toggle_split_direction
dwindle_manual_split=0

# switch layout
# bindc=SUPER,e,setlayout,dwindle
bind=SUPER,e,setlayout,dwindle
bind=SUPER,t,setlayout,right_tile
bind=SUPER+SHIFT,T,setlayout,vertical_tile
bind=SUPER,g,setlayout,fair
bind=SUPER+SHIFT,G,setlayout,vertical_fair
bind=SUPER,c,setlayout,scroller
bind=SUPER+SHIFT,c,switch_proportion_preset

scroller_structs=0
scroller_default_proportion=1.0
scroller_proportion_preset=1.0,0.5
new_is_master=0
default_master_factor=0.67
dwindle_drop_simple_split=0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


#

var=font_family,Lilex Nerd Font
jump_label_decorate_font_desc=$font_family
group_bar_decorate_font_desc=$font_family
tab_bar_decorate_font_desc=$font_family
title_message_bar_decorate_font_desc=$font_family
focus_color=0xc0c0c0ff
split_color=0x900000ff
cursor_size=24
cursor_theme=Bibata-Original-Classic

smart_gaps=1
no_border_when_single=1
group_bar_decorate_corner_radius=0
tab_bar_decorate_corner_radius=0
# gap_outer_horizontal=0
# gap_outer_vertical=0
# gap_inner_horizontal=10
# gap_inner_vertical=10
# border_px=0
focus_on_activate=1
# animation_duration_move=250
# animation_duration_open=250
animation_duration_tag=0
animation_duration_close=0
animation_duration_focus=0
allow_tearing=1

bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_SINK@ toggle && canberra-gtk-play -i audio-volume-change
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_SINK@ 5%- && canberra-gtk-play -i audio-volume-change
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_SINK@ 5%+ --limit 1.0 && canberra-gtk-play -i audio-volume-change
bindl=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_SOURCE@ toggle && canberra-gtk-play -i audio-volume-change
bindlc=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindlc=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 10%+

var=cmd,mangonag -t info -y overlay -f 'Lilex Nerd Font 11' -m 'logout...'
var=reboot,-Z 'reboot' 'systemctl reboot'
var=poweroff,-Z 'poweroff' 'systemctl poweroff'
var=exit,-Z 'exit' 'swaymsg exit'
var=hibernate,-Z 'hibernate' 'systemctl hibernate'
var=hybrid_sleep,-Z 'hybrid-sleep' 'systemctl hybrid-sleep'
var=suspend,-Z 'suspend' 'systemctl suspend'
var=lock,-Z 'lock' 'swaylock -f -c 202020'
bind=SUPER,l,spawn_shell,$cmd $reboot $poweroff $exit $sleep $suspend $lock

env=QT_QPA_PLATFORMTHEME,qt5ct:qt6ct

exec=swaybg -i ~/.local/share/backgrounds/background -m fill
exec_once=swayidle -w timeout 900 'wlopm --off \*' resume 'wlopm --on \*' before-sleep 'playerctl pause'
exec_once=nm-applet --indicator
exec_once=firewall-applet
exec_once=deluge-gtk
exec_once=blueman-applet
exec_once=wlsunset -S 8:00 -s 22:00 -t 2500 -T 6500
# arch
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# ubuntu
exec_once=/usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec_once=dbus-update-activation-environment --systemd --all
exec_once=sh -c 'cliphist wipe && cliphist compact'
exec_once=wl-paste --watch cliphist store
exec=sh -c 'pkill -x kanshi && exec kanshi'
exec_once=udiskie --tray
exec=sh -c 'pkill -x waybar && waybar'

window_rule=app_id:Microsoft-edge,tags:1
window_rule=title:Microsoft-edge,tags:1
window_rule=app_id:firefox,tags:1
window_rule=app_id:zed,tags:2
window_rule=app_id:adhd,is_floating:1,is_fullscreen:1
window_rule=app_id:org.pulseaudio.pavucontrol,is_floating:1
window_rule=app_id:pavucontrol,is_floating:1
