[colors]
;background = #282A2E
;background-alt = #373B41
;foreground = #C5C8C6
;primary = #F0C674
;secondary = #8ABEB7
;alert = #A54242
;disabled = #707880

background = #002b36
background-alt = #073642
foreground = #C5C8C6
;primary = #F0C674
primary = #008ed4
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/main]
click-left = xfce4-taskmanager
;scroll-up = i3-msg workspace prev
;scroll-down = i3-msg workspace next
scroll-up = "#i3.prev"
scroll-down = "#i3.next"

bottom=true

width = 100%
height = 20pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-top-size = 0pt
border-bottom-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 0

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace;2

; modules-left = xworkspaces xwindow
; modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth systray date
modules-left = i3 xwindow battery
modules-right = systray cpu memory pulseaudio pulseaudio2 date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/i3]
type = internal/i3

wrapping-scroll = false

label-mode = %mode%
label-mode-background = ${colors.alert}

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-visible = %index%
label-visible-underline = ${colors.disabled}
label-visible-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1


; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 0pt
tray-spacing = 0pt
tray-size = 24pt

;[module/xworkspaces]
;type = internal/xworkspaces

;reverse-scroll = true
;enable-scroll = false

;label-active = %name%
;label-active-background = ${colors.background-alt}
;label-active-underline= ${colors.primary}
;label-active-padding = 1

;label-occupied = %name%
;label-occupied-padding = 1

;label-urgent = %name%
;label-urgent-background = ${colors.alert}
;label-urgent-padding = 1

;label-empty = %name%
;label-empty-foreground = ${colors.disabled}
;label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio

click-right = pavucontrol

use-ui-max = false
interval = 5

;format-volume-prefix = "VOL "
format-volume-prefix = %{A4:pactl set-sink-volume @DEFAULT_SINK@ +10% && canberra-gtk-play -i audio-volume-change:}%{A5:pactl set-sink-volume @DEFAULT_SINK@ -10% && canberra-gtk-play -i audio-volume-change:}VOL %{A}%{A}
format-volume-prefix-foreground = ${colors.primary}
;format-volume = <label-volume>
format-volume = %{A4:pactl set-sink-volume @DEFAULT_SINK@ +10% && canberra-gtk-play -i audio-volume-change:}%{A5:pactl set-sink-volume @DEFAULT_SINK@ -10% && canberra-gtk-play -i audio-volume-change:}<label-volume>%{A}%{A}

label-volume = %percentage:3%%

label-muted = "VOL ---%"
label-muted-foreground = ${colors.disabled}

;scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +10% && canberra-gtk-play -i audio-volume-change
;scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -10% && canberra-gtk-play -i audio-volume-change

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:3%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:3%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

;date-alt = %H:%M
date = %Y-%m-%d %H:%M:%S

label=%{A1:xfce4-session-logout:}%date% %{A}
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
